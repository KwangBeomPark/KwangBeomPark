  <!-- Background Base -->
  <rect width="1200" height="530" fill="#090d16"/>
  <rect width="1200" height="530" fill="url(#bp-glow-blue)"/>
  <rect width="1200" height="530" fill="url(#bp-glow-purple)"/>

  <!-- Subtle Horizontal Grid -->
  <g stroke="#1e293b" stroke-width="0.6" opacity="0.35">
    <line x1="40" y1="75" x2="1160" y2="75"/>
    <line x1="40" y1="465" x2="1160" y2="465"/>
  </g>

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(40, 22)">
    <rect x="0" y="0" width="220" height="22" rx="11" fill="#0284c7" fill-opacity="0.15" stroke="#0284c7" stroke-width="0.8"/>
    <text x="110" y="15" fill="#38bdf8" font-size="10.5" font-weight="700" letter-spacing="1.2" text-anchor="middle">FINOPS &amp; DX BLUEPRINT</text>
    
    <text x="0" y="44" fill="#ffffff" font-size="20" font-weight="800" letter-spacing="-0.5">
      Enterprise FinOps &amp; Commercial Operations Ecosystem
    </text>
    <text x="1120" y="38" fill="#94a3b8" font-size="12" font-weight="500" text-anchor="end">
      End-to-End Operational Architecture · Ledger Integrity · Automated Controls
    </text>
  </g>

  <!-- ==================== 4-LAYER ARCHITECTURE ==================== -->

  <!-- LAYER 4: Executive & Commercial Intelligence -->
  <g transform="translate(40, 85)">
