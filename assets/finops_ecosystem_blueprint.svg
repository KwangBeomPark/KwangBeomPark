      <text x="14" y="40" fill="#fde68a" font-size="10.5">Reconciliation &amp; Document OCR</text>
      <text x="14" y="53" fill="#64748b" font-size="9.5">Zero-cloud local OCR &amp; multilingual (EN/KO/PL) review</text>
    </g>

    <!-- App 07: EML Viewer -->
    <g transform="translate(785, 10)">
      <rect width="320" height="62" rx="7" fill="url(#bp-sub-grad)" stroke="#b45309" stroke-width="1"/>
      <text x="14" y="24" fill="#f8fafc" font-size="12" font-weight="700">🔍 07_eml-viewer</text>
      <text x="14" y="40" fill="#fde68a" font-size="10.5">Email Evidence Sandbox Viewer</text>
      <text x="14" y="53" fill="#64748b" font-size="9.5">Isolated inspection, tracker blocking &amp; clean forwarding</text>
    </g>
  </g>

  <!-- ==================== FOOTER GUARANTEE PILLS ==================== -->
  <g transform="translate(40, 478)">
    <rect x="0" y="0" width="260" height="26" rx="6" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="0.8"/>
    <text x="130" y="17" fill="#cbd5e1" font-size="10.5" font-weight="600" text-anchor="middle">🔒 Zero-Cloud &amp; GDPR Compliant</text>

    <rect x="280" y="0" width="270" height="26" rx="6" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="0.8"/>
    <text x="415" y="17" fill="#cbd5e1" font-size="10.5" font-weight="600" text-anchor="middle">⚡ Non-Admin Lightweight Execution</text>

    <rect x="570" y="0" width="280" height="26" rx="6" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="0.8"/>
    <text x="710" y="17" fill="#cbd5e1" font-size="10.5" font-weight="600" text-anchor="middle">📜 Official CA Authenticode Code Signing</text>

    <rect x="870" y="0" width="250" height="26" rx="6" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="0.8"/>
    <text x="995" y="17" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">🏛️ Business First · Technology Second</text>
  </g>
