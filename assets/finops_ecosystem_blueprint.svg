  <g transform="translate(40, 370)">
    <rect width="1120" height="82" rx="10" fill="url(#bp-card-grad)" stroke="url(#border-amber)" stroke-width="1.2"/>
    <rect x="14" y="10" width="190" height="20" rx="4" fill="#d97706" fill-opacity="0.2"/>
