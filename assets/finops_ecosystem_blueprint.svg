    <text x="24" y="46" fill="#f8fafc" font-size="13" font-weight="700">Governance &amp; Decision Reporting</text>
    <text x="24" y="64" fill="#94a3b8" font-size="10.5">Board distribution, confidential slide management &amp; retail margin monitoring</text>

    <!-- App 03: PPT Add-in -->
    <g transform="translate(450, 10)">
